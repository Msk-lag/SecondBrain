services:
  mariadb:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        # `MC_HOST_<alias>` 環境変数方式は資格情報のURLエンコードが必要になり、r6([B-1]・[E-2]:
        # 未エンコードによる実害)・r7([B-2]:過剰な事前検証による有効な資格情報の拒否)と
        # 2ラウンド連続で問題が発生したため `mc alias set` へ差し戻す
        # (Codex コードレビュー r7 指摘 [B-2] への対応。scripts/minio-app-policy.sh 冒頭のコメント参照)。
        # `until ...; do sleep 1; done` は MinIO 起動待ちだけでなく認証失敗等の恒久的なエラーでも
        # 無期限に再試行してしまう(Codex コードレビュー r7 指摘 [B-1] への対応)。試行回数の
        # 上限を設け、上限到達時は最後のエラーを出力して非ゼロ終了する。
        MC_ALIAS_SET_MAX_ATTEMPTS=30
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/tmp/mc-alias-set-error; do
          i=$$((i + 1))
          if [ "$$i" -ge "$$MC_ALIAS_SET_MAX_ATTEMPTS" ]; then
            echo "mc alias set failed after $$MC_ALIAS_SET_MAX_ATTEMPTS attempts:" >&2
            cat /tmp/mc-alias-set-error >&2
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        MC_ROOT_USER="$$MINIO_ROOT_USER" MC_ROOT_PASSWORD="$$MINIO_ROOT_PASSWORD" MC_APP_SECRET_KEY="$$MINIO_APP_SECRET_KEY" \
          sh /scripts/minio-app-policy.sh http://minio:9000 local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_BUCKET" secondbrain-app-policy

volumes:
  mariadb_data:
  minio_data:
